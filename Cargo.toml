[package]
name = "webfavorites-fast-scrnshot"
version = "2.0.0"
edition = "2021"
rust-version = "1.79"
description = "本地网页收藏夹 HTML 查看器 + 快速长图截图工具"
license = "MIT"

[[bin]]
name = "WebFavoritesFastScrnshot"
path = "src/main.rs"

[dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = [
    "tree-view",
    "image-list",
    "timer",
    "image-decoder",
    "no-styling",
] }
winapi = { version = "0.3.9", features = [
    "basetsd",
    "commctrl",
    "commdlg",
    "combaseapi",
    "knownfolders",
    "libloaderapi",
    "minwindef",
    "shellapi",
    "shlobj",
    "stringapiset",
    "winbase",
    "windef",
    "winerror",
    "wingdi",
    "winnls",
    "winnt",
    "winuser",
    "uxtheme",
] }
flate2 = "1.1"
crc32fast = "1.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
